# Rebuilds the finspider company library (Nifty 50 + S&P 100) every Monday and commits it,
# so the dashboard search always has recent, verified reports. Can also be run by hand from
# the repo's Actions tab ("Run workflow").
name: Refresh finspider library

on:
  schedule:
    - cron: "0 2 * * 1"        # Mondays 02:00 UTC (07:30 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finspider-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/finspider/requirements.txt

      - name: Install
        run: pip install -r tools/finspider/requirements.txt

      - name: Build library
        run: python tools/finspider/build_library.py --out library

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library tools/finspider/constituents.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh finspider library ($(date -u +%F))"
            git push
          fi
