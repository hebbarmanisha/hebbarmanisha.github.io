<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manisha Hebbar Research</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Research papers, key findings and writing by Manisha Hebbar.">
<meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<script>try { var th = localStorage.getItem("theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a profile rail on the left (stacks below on phones),
   and a working area: hero with live Nifty line and headline numbers, then research, projects
   and writing as cards that open into factsheet-style pages.
   One deliberate dark look: deep navy-black, a muted teal accent, soft amber for highlights. */
:root {
  --bg: #0a0e13;
  --bg-2: #0d1219;
  --surface: #10171f;
  --surface-2: #151e28;
  --line: #1e2834;
  --line-2: #2c3947;
  --ink: #e6eaf0;
  --muted: #8b97a6;
  --accent: #6cc2b0;
  --accent-ink: #06231e;
  --accent-soft: #12282a;
  --gold: #d6a95c;
  --gold-soft: #241f15;
  --neg: #e08a7f;
  --up: #6cc2b0;
  --ink-2: #c3cad4;
  --grid: rgba(150, 175, 200, 0.035);
  --glow: rgba(108, 194, 176, 0.10);
  --chart-bg: rgba(10, 14, 19, 0.55);
  --shadow: rgba(0, 0, 0, 0.85);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --rail: 290px;
  --radius: 14px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
  --bg: #f4f6f8; --bg-2: #edf0f4; --surface: #ffffff; --surface-2: #f6f8fa;
  --line: #e0e5eb; --line-2: #cbd3dc; --ink: #0f1720; --ink-2: #3a4655; --muted: #5d6a79;
  --accent: #1d7a6c; --accent-ink: #ffffff; --accent-soft: #e2f1ee;
  --gold: #976712; --gold-soft: #f9f0df; --neg: #b3453b; --up: #1d7a6c;
  --grid: rgba(20, 40, 60, 0.045); --glow: rgba(29, 122, 108, 0.08);
  --chart-bg: #fbfcfd; --shadow: rgba(15, 23, 32, 0.22);
  color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f6f8; --bg-2: #edf0f4; --surface: #ffffff; --surface-2: #f6f8fa;
  --line: #e0e5eb; --line-2: #cbd3dc; --ink: #0f1720; --ink-2: #3a4655; --muted: #5d6a79;
  --accent: #1d7a6c; --accent-ink: #ffffff; --accent-soft: #e2f1ee;
  --gold: #976712; --gold-soft: #f9f0df; --neg: #b3453b; --up: #1d7a6c;
  --grid: rgba(20, 40, 60, 0.045); --glow: rgba(29, 122, 108, 0.08);
  --chart-bg: #fbfcfd; --shadow: rgba(15, 23, 32, 0.22);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
/* faint chart-paper grid and a soft light from the top: fixed behind everything */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1100px 520px at 72% -12%, var(--glow), transparent 62%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 44px 44px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
.eyebrow {
  font: 500 11.5px/1.3 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
}
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--neg); } .flat { color: var(--muted); }

/* ---------- Live dot (used on the Market Matters panel) ---------- */
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 70% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); } }

.shell { position: relative; z-index: 1; }
.shell {
  display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
  max-width: 1320px; margin: 0 auto; min-height: 100vh;
}

/* ---------- Profile rail ---------- */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; scrollbar-width: thin;
  padding-block: 32px 24px;
  padding-left: max(26px, env(safe-area-inset-left, 0px)); padding-right: 26px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 20px;
}
.rail-id { display: flex; align-items: center; gap: 14px; }
.contact-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.theme-btn {
  flex: none; width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
  display: grid; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line-2);
  transition: color .2s, border-color .2s, transform .3s var(--ease);
}
.theme-btn:hover { color: var(--accent); border-color: var(--accent); }
.theme-btn:active { transform: rotate(25deg) scale(.92); }
.theme-btn svg { width: 17px; height: 17px; }
.theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: block; } :root[data-theme="dark"] .theme-btn .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-btn .sun { display: block; } :root:not([data-theme="light"]) .theme-btn .moon { display: none; } }
.monogram {
  width: 50px; height: 50px; border-radius: 12px; flex: none;
  display: grid; place-items: center; position: relative;
  background: linear-gradient(145deg, var(--surface-2), var(--bg-2));
  border: 1px solid var(--line-2); color: var(--ink);
  font: 800 18px/1 var(--f-display); letter-spacing: .02em;
}
.monogram::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
.rail h1 { font-size: 21px; line-height: 1.15; font-weight: 700; }
.rail .headline { color: var(--muted); font-size: 13px; margin-top: 2px; }
.rail .roles { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.rail .roles span + span { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px; padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--line-2); color: var(--muted); background: transparent;
}
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; margin-inline: -12px; border-radius: 8px; font-size: 14px; position: relative;
  color: var(--muted); transition: color .2s, background .2s;
}
.nav button::before {
  content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 2px;
  background: var(--accent); transform: scaleY(0); transition: transform .25s var(--ease);
}
.nav button:hover { background: var(--surface); color: var(--ink); }
.nav button[aria-current="true"] { color: var(--ink); background: var(--surface); }
.nav button[aria-current="true"]::before { transform: scaleY(1); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .count { font: 500 12px var(--f-mono); color: var(--muted); }
.contact { display: flex; flex-direction: column; gap: 8px; margin-top: auto; font-size: 13.5px; padding-top: 16px; border-top: 1px solid var(--line); }
.contact-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.email { font-family: var(--f-mono); font-size: 12.5px; user-select: all; overflow-wrap: anywhere; }
.copy {
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 2px 9px; font-size: 12px; cursor: pointer; transition: border-color .2s;
}
.copy:hover { border-color: var(--accent); }
.links { display: flex; gap: 14px; flex-wrap: wrap; }
.loc { color: var(--muted); font-size: 12.5px; }

/* ---------- Main ---------- */
main {
  min-width: 0;
  padding-block: 32px 80px;
  padding-left: 44px; padding-right: max(44px, env(safe-area-inset-right, 0px));
}
.view-enter { animation: view-in .45s var(--ease) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(10px); } }
.section { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 24px; }
.section + .section { margin-top: 64px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.section-head .eyebrow { display: block; margin-bottom: 6px; color: var(--accent); }
.section-head h2 { font-size: clamp(24px, 2.6vw, 30px); }
.section-head p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 18px;
  border: 1px solid var(--line); background: linear-gradient(160deg, var(--surface) 0%, var(--bg-2) 70%);
  padding: 40px 40px 0; display: flex; flex-direction: column; gap: 32px;
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(600px 300px at 85% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%);
}
.hero-top { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: center; position: relative; }
.hero-copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.hero-tag { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; padding: 5px 12px 5px 10px; border: 1px solid var(--line-2); border-radius: 99px; font: 500 11.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero h2 { font-size: clamp(42px, 6.2vw, 76px); line-height: .98; font-weight: 800; letter-spacing: -0.03em; }
.hero h2 .soft { color: var(--muted); font-weight: 600; }
.hero .pitch { margin: 0; font-size: 16.5px; line-height: 1.6; color: var(--ink-2); max-width: 52ch; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-chart { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--chart-bg); padding: 14px 16px 10px; min-width: 0; }
.hero-chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hero-chart-head .big { font: 600 22px var(--f-mono); }
.hero-chart svg { display: block; width: 100%; height: 150px; margin-top: 8px; overflow: visible; }
.hero-chart .gridline { stroke: var(--line); stroke-width: 1; }
.hero-chart .area { fill: url(#heroFill); }
.hero-chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.hero-chart .end { fill: var(--accent); }
.hero-chart .end-ring { fill: none; stroke: var(--accent); opacity: .5; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .6; } to { transform: scale(3.2); opacity: 0; } }
.hero-chart .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); margin-top: 4px; }
.hero-chart .foot a { color: var(--muted); text-decoration: none; }
.hero-chart .foot a:hover { color: var(--accent); }
.hero-stats { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); margin-inline: -40px; }
.hero-stats > div { padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 4px; }
.hero-stats > div + div { border-left: 1px solid var(--line); }
.hero-stats strong { font: 700 34px/1 var(--f-display); letter-spacing: -0.02em; }
.hero-stats span { font-size: 12.5px; color: var(--muted); }

/* ---------- Cards ---------- */
.papers { display: flex; flex-direction: column; gap: 14px; }
.paper-card, .post, .more-item {
  --mx: 50%; --my: 50%;
  position: relative; isolation: isolate;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  transition: transform .35s var(--ease), border-color .25s, box-shadow .35s var(--ease);
}
/* soft spotlight that follows the pointer */
.paper-card::before, .post::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
  background: radial-gradient(420px circle at var(--mx) var(--my), color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%);
  opacity: 0; transition: opacity .3s;
}
.paper-card:hover, .post:hover {
  transform: translateY(-3px); border-color: var(--line-2);
  box-shadow: 0 22px 44px -26px var(--shadow), 0 0 0 1px color-mix(in srgb, var(--accent) 14%, transparent);
}
.paper-card:hover::before, .post:hover::before { opacity: 1; }
.paper-card {
  display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 28px;
  padding: 26px 28px; cursor: pointer;
}
.paper-card .body { display: flex; flex-direction: column; gap: 11px; min-width: 0; }
.paper-card h3 { font-size: 21px; line-height: 1.25; font-weight: 700; }
.paper-card .headline { margin: 0; color: var(--ink-2); }
.paper-card .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.paper-card .meta span:first-child { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 5px; padding: 1px 7px; }
.paper-card .meta span + span::before { content: "·"; margin-right: 10px; color: var(--line-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; color: var(--muted); background: var(--bg-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 8px; }
.card-stats { display: flex; flex-direction: column; gap: 16px; border-left: 1px solid var(--line); padding-left: 24px; justify-content: center; }
.card-stat strong { display: block; font: 700 28px/1.05 var(--f-display); color: var(--accent); letter-spacing: -0.02em; }
.card-stat span { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: block; margin-top: 4px; }
.card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
  border-radius: 9px; padding: 8px 15px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  transition: transform .2s var(--ease), background .2s, border-color .2s, color .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
.btn .arr { transition: transform .2s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }

/* Projects: cards reuse the research card styles; the live demo sits on the project page */
.demo { display: flex; flex-direction: column; gap: 12px; }
.demo-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.switch { display: flex; gap: 6px; flex-wrap: wrap; }
.switch button {
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer;
  border-radius: 99px; padding: 5px 13px; font-size: 13.5px; font-weight: 500;
}
.switch button:hover { border-color: var(--accent); }
.switch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.demo .cap { margin: 0; font-size: 13px; color: var(--muted); max-width: 80ch; }
/* company search */
.search { position: relative; max-width: 640px; }
.search input {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 14px 11px 38px; transition: border-color .2s, box-shadow .2s;
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search ul {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px;
  list-style: none; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: 0 16px 40px -12px var(--shadow); max-height: 360px; overflow-y: auto;
}
.search li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.search li[aria-selected="true"], .search li:hover { background: var(--accent-soft); }
.search li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search li .tk { font: 500 12px var(--f-mono); color: var(--muted); }
.search li .vd { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.search li .vd.good { color: var(--up); } .search li .vd.ok { color: var(--gold); } .search li .vd.bad { color: var(--neg); }
.search li.live { color: var(--accent); font-weight: 500; }
.search li.note { cursor: default; color: var(--muted); font-size: 13px; }
.search li.note:hover { background: none; }
.search-meta { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.chipbtn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 3px 11px; font-size: 13px; cursor: pointer; transition: border-color .2s; }
.chipbtn:hover { border-color: var(--accent); }
.search-status { font-size: 13.5px; color: var(--muted); min-height: 1.4em; }
.search-status.err { color: var(--neg); }
.covered { font-size: 13px; color: var(--muted); }
.covered summary { cursor: pointer; color: var(--accent); }
.covered .cols { columns: 3 220px; margin-top: 10px; }
.covered .cols div { break-inside: avoid; padding: 2px 0; }
.covered .skip { margin-top: 10px; }
.site-cta {
  position: relative; overflow: hidden;
  display: flex; justify-content: space-between; align-items: center; gap: 14px 20px; flex-wrap: wrap;
  padding: 22px 24px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  background: linear-gradient(120deg, var(--accent-soft), var(--surface) 70%);
}
.site-cta > div { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.site-cta .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); }
.site-host { font: 500 15px var(--f-mono); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.site-host:hover { color: var(--accent); text-decoration: underline; }
.btn.big { padding: 12px 22px; font-size: 15px; }
.demo fin-spider { display: block; --fs-font: var(--f-body); --fs-mono: var(--f-mono); }
.source-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.source-list li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; }
.source-list li::before { content: ""; width: 6px; height: 6px; margin-top: 9px; border-radius: 50%; background: var(--muted); }

/* Writing */
.substack-head {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 20px 24px; border-radius: var(--radius); border: 1px solid var(--line);
  background: linear-gradient(120deg, var(--gold-soft), var(--surface) 65%);
}
.substack-head p { margin: 0; max-width: 62ch; font-size: 14.5px; color: var(--ink-2); }
.substack-head b { color: var(--ink); }
.posts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.post {
  display: flex; flex-direction: column; gap: 9px; text-decoration: none; color: inherit; padding: 20px 22px;
}
.post h3 { font-size: 18px; line-height: 1.3; font-weight: 700; }
.post p { margin: 0; color: var(--muted); font-size: 14px; }
.post .meta { display: flex; justify-content: space-between; gap: 8px; }
.post .meta span:first-child { color: var(--gold); }
.post .go { margin-top: auto; padding-top: 4px; font-size: 13px; color: var(--accent); font-weight: 600; display: inline-flex; gap: 6px; }
.post .go .arr { transition: transform .25s var(--ease); }
.post:hover .go .arr { transform: translate(3px, -3px); }

.more-list { display: flex; flex-direction: column; gap: 12px; }
.more-item { padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.more-item h3 { font-size: 17px; }
.more-item p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- Paper / project detail ---------- */
.detail { display: flex; flex-direction: column; gap: 36px; }
.back {
  all: unset; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 500; align-self: flex-start;
  display: inline-flex; gap: 8px; transition: color .2s;
}
.back:hover { color: var(--accent); }
.back .arr { transition: transform .2s var(--ease); }
.back:hover .arr { transform: translateX(-3px); }
.back:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.detail-head { display: flex; flex-direction: column; gap: 14px; max-width: 900px; }
.detail-head .eyebrow { color: var(--accent); }
.detail-head h2 { font-size: clamp(28px, 3.6vw, 44px); line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; }
.byline { color: var(--muted); font-size: 14px; }
.byline b { color: var(--ink); font-weight: 600; }
.question {
  border: 1px solid var(--line); border-left: 3px solid var(--gold); background: linear-gradient(100deg, var(--gold-soft), var(--surface) 80%);
  padding: 16px 20px; border-radius: 0 12px 12px 0; max-width: 900px;
}
.question .eyebrow { color: var(--gold); }
.question p { margin: 6px 0 0; font: 500 18px/1.5 var(--f-body); color: var(--ink); }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.stat-row > div { padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.stat-row > div + div { border-left: 1px solid var(--line); }
.stat-row strong { font: 700 32px/1 var(--f-display); color: var(--accent); letter-spacing: -0.02em; }
.stat-row span { font-size: 13px; color: var(--muted); line-height: 1.45; }

.two-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.block { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.block h3 { font-size: 21px; }
.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; counter-reset: f; }
.findings li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; line-height: 1.6; padding: 10px 0; border-bottom: 1px solid var(--line); }
.findings li:last-child { border-bottom: 0; }
.findings li::before { counter-increment: f; content: counter(f, decimal-leading-zero); font: 500 12px/1.6 var(--f-mono); color: var(--accent); padding-top: 2px; }
.factsheet { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.factsheet div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 12px 16px; transition: background .2s; }
.factsheet div:hover { background: var(--surface-2); }
.factsheet div + div { border-top: 1px solid var(--line); }
.factsheet dt { font: 500 11.5px/1.6 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.factsheet dd { margin: 0; font-size: 14px; }
.abstract { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 72ch; line-height: 1.7; }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.chart h4 { margin: 0; font: 600 15px/1.35 var(--f-body); }
.chart .cap { margin: 0; font-size: 12.5px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr) 62px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .lbl { color: var(--ink); line-height: 1.25; }
.bar-row .val { font: 500 12.5px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 14px; background: var(--bg-2); border-radius: 4px; }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), var(--accent)); transform-origin: left center; }
.fill.s1 { background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 55%, transparent), var(--gold)); }
.fill.neg { background: linear-gradient(270deg, color-mix(in srgb, var(--neg) 55%, transparent), var(--neg)); transform-origin: right center; }
.zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--accent); }
.legend i.s1 { background: var(--gold); }
.group-label { font: 500 11.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
.matrix-wrap { overflow-x: auto; }
.matrix { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 13px; }
.matrix th { font-weight: 500; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 4px; }
.matrix th[scope="row"] { text-align: left; color: var(--ink); font-size: 13px; white-space: nowrap; padding-right: 8px; }
.matrix td {
  text-align: center; padding: 10px 4px; border-radius: 6px; font: 500 14px var(--f-mono); color: var(--ink);
  font-variant-numeric: tabular-nums; border: 2px solid transparent;
}
.matrix td.best { border-color: var(--gold); }

.reader { display: flex; flex-direction: column; gap: 12px; }
.reader-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.reader-frame {
  max-height: 85vh; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg-2); padding: 16px; display: flex; flex-direction: column; gap: 14px; align-items: center;
}
.page-slot { width: 100%; max-width: 820px; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.45); border-radius: 3px; position: relative; }
.page-slot canvas { display: block; width: 100%; height: auto; border-radius: 3px; }
.page-slot .pno { position: absolute; right: 8px; bottom: 6px; font: 500 11px var(--f-mono); color: #777; }
.reader-note { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }

.footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ---------- Motion (only when the visitor hasn't asked for reduced motion) ---------- */
.anim .reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s var(--ease) var(--d, 0ms), transform .7s var(--ease) var(--d, 0ms), border-color .25s, box-shadow .35s var(--ease); }
.anim .reveal.in { opacity: 1; transform: none; }
.anim .reveal.in.paper-card:hover, .anim .reveal.in.post:hover { transform: translateY(-3px); transition-delay: 0ms; }
.anim .chart .fill { transform: scaleX(0); transition: transform 1s var(--ease) calc(var(--d, 0ms) + 150ms); }
.anim .chart.in .fill { transform: scaleX(1); }
.anim .matrix td { opacity: 0; transform: scale(.85); transition: opacity .5s var(--ease) var(--d, 0ms), transform .5s var(--ease) var(--d, 0ms); }
.anim .chart.in .matrix td { opacity: 1; transform: none; }
.anim .hero-copy > * { animation: rise .8s var(--ease) both; }
.anim .hero-copy > *:nth-child(2) { animation-delay: .08s; }
.anim .hero-copy > *:nth-child(3) { animation-delay: .16s; }
.anim .hero-copy > *:nth-child(4) { animation-delay: .24s; }
.anim .hero-chart { animation: rise .9s var(--ease) .2s both; }
.anim .hero-stats > div { animation: rise .8s var(--ease) both; }
.anim .hero-stats > div:nth-child(2) { animation-delay: .07s; }
.anim .hero-stats > div:nth-child(3) { animation-delay: .14s; }
.anim .hero-stats > div:nth-child(4) { animation-delay: .21s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.anim .hero-chart .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s var(--ease) .45s forwards; }
.anim .hero-chart .area { opacity: 0; animation: fade 1s ease 1.4s forwards; }
.anim .hero-chart .end, .anim .hero-chart .end-ring { opacity: 0; animation: fade .4s ease 2.1s forwards; }
.anim .hero-chart .end-ring { animation: fade .4s ease 2.1s forwards, ring 2.4s ease-out 2.2s infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .paper-card { grid-template-columns: minmax(0, 1fr); }
  .card-stats { border-left: 0; padding-left: 0; flex-direction: row; flex-wrap: wrap; gap: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
  .card-stat { flex: 1 1 160px; }
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .hero-top { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: static; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line);
    padding-block: 22px 20px; gap: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    order: 2;
  }
  main { order: 1; }
  .nav { flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .nav button { margin-inline: 0; border: 1px solid var(--line-2); gap: 8px; padding: 6px 12px; }
  .nav button::before { display: none; }
  .contact { margin-top: 0; }
  main { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hero { padding: 26px 20px 0; gap: 24px; }
  .hero-stats { margin-inline: -20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-stats > div:nth-child(3) { border-left: 0; }
  .hero-stats > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .hero-stats > div { padding: 16px 20px; }
  .hero-stats strong { font-size: 28px; }
  .posts { grid-template-columns: minmax(0, 1fr); }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-row > div:nth-child(3) { border-left: 0; }
  .stat-row > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .paper-card { padding: 20px; }
  .reader-frame { padding: 8px; }
}
@media (max-width: 520px) {
  .bar-row { grid-template-columns: minmax(0, 1fr) 58px; }
  .bar-row .lbl { grid-column: 1 / -1; }
  .factsheet div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .stat-row strong { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>

<script src="content.js?v=7"></script>
<script>
(function () {
  const S = window.SITE;
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (iso) => {
    const d = new Date(iso + "T00:00:00");
    return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  };
  const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("");
  // Motion only for visitors who haven't asked their device for reduced motion
  const ANIM = !matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window;
  if (ANIM) document.documentElement.classList.add("anim");

  /* ---------- Rail ---------- */
  function renderRail() {
    const p = S.profile;
    const more = (S.more || []).length;
    $("#rail").innerHTML = `
      <div class="rail-id">
        <div class="monogram" aria-hidden="true">${esc(initials(p.name))}</div>
        <div>
          <h1>${esc(p.name)}</h1>
          <div class="headline">${esc(p.headline)}</div>
        </div>
      </div>
      <div class="roles">
        ${p.roles.map((r) => `<span>${esc(r)}</span>`).join("")}
        ${p.institution ? `<span>${esc(p.institution)}</span>` : ""}
      </div>
      <div class="chips">${p.focus.map((f) => `<span class="chip">${esc(f)}</span>`).join("")}</div>
      <nav class="nav" aria-label="Sections">
        <button data-go="research">Research <span class="count">${S.papers.length}</span></button>
        ${(S.projects || []).length ? `<button data-go="projects">Projects <span class="count">${S.projects.length}</span></button>` : ""}
        <button data-go="writing">Writing <span class="count">${S.writing.length}</span></button>
        ${more ? `<button data-go="more">More <span class="count">${more}</span></button>` : ""}
      </nav>
      <div class="contact">
        <div class="contact-head"><span class="eyebrow">Contact</span>
          <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch between light and dark">
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
          </button>
        </div>
        ${p.email ? `<div class="contact-row"><span class="email" id="email">${esc(p.email)}</span><button class="copy" id="copy-email" type="button">Copy</button></div>` : ""}
        <div class="links">${(p.links || []).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
        <span class="loc">${esc(p.location)}</span>
      </div>`;
    $("#theme-btn").addEventListener("click", () => {
      const cur = document.documentElement.dataset.theme
        || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      const next = cur === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
    const copyBtn = $("#copy-email");
    if (copyBtn) copyBtn.addEventListener("click", () => {
      const done = () => { copyBtn.textContent = "Copied"; setTimeout(() => (copyBtn.textContent = "Copy"), 1600); };
      try {
        navigator.clipboard.writeText(p.email).then(done, selectEmail);
      } catch (e) { selectEmail(); }
    });
    function selectEmail() {
      const r = document.createRange(); r.selectNodeContents($("#email"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      copyBtn.textContent = "Selected";
    }
    $("#rail").querySelectorAll("[data-go]").forEach((b) =>
      b.addEventListener("click", () => go(b.dataset.go)));
  }

  /* ---------- Home ---------- */
  function paperCard(p) {
    const top = p.stats.slice(0, 2);
    return `
      <article class="paper-card" data-open="${esc(p.id)}" tabindex="0" aria-label="Open ${esc(p.shortTitle)}">
        <div class="body">
          <div class="meta eyebrow"><span>${esc(p.kind)}</span><span>${esc(p.date)}</span><span>${esc(p.area)}</span></div>
          <h3>${esc(p.title)}</h3>
          <p class="headline">${esc(p.headline)}</p>
          <div class="tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          <div class="card-actions">
            <button class="btn" type="button" data-open="${esc(p.id)}">Key findings &amp; full paper <span class="arr" aria-hidden="true">→</span></button>
            ${p.pdf ? `<a class="btn ghost" href="${esc(p.pdf)}" target="_blank" rel="noopener">Open PDF <span class="arr" aria-hidden="true">↗</span></a>` : ""}
          </div>
        </div>
        <div class="card-stats">
          ${top.map((s) => `<div class="card-stat"><strong class="num">${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join("")}
        </div>
      </article>`;
  }

  // A live demo is a custom element (e.g. <fin-spider>) whose script loads on first use.
  function demoHTML(d) {
    const tag = /^[a-z][a-z0-9]*-[a-z0-9-]+$/.test(d.tag || "") ? d.tag : null;
    if (!tag) return "";
    const attrs = Object.entries(d.attrs || {})
      .map(([k, v]) => (/^[a-z][a-z0-9-]*$/.test(k) ? (v === "" ? ` ${k}` : ` ${k}="${esc(v)}"`) : "")).join("");
    return `<${tag}${attrs}></${tag}>`;
  }
  const loadedScripts = new Set();
  function loadDemoScript(src) {
    if (!src || loadedScripts.has(src)) return;
    loadedScripts.add(src);
    const s = document.createElement("script");
    s.src = src;
    document.body.appendChild(s);
  }

  // Same card as a research paper: summary on the left, two headline stats on the right.
  function projectCard(p) {
    const top = (p.stats || []).slice(0, 2);
    return `
      <article class="paper-card" data-open="${esc(p.id)}" tabindex="0" aria-label="Open ${esc(p.shortTitle || p.title)}">
        <div class="body">
          <div class="meta eyebrow"><span>${esc(p.kind || "Project")}</span>${p.date ? `<span>${esc(p.date)}</span>` : ""}${p.area ? `<span>${esc(p.area)}</span>` : ""}</div>
          <h3>${esc(p.title)}</h3>
          <p class="headline">${esc(p.headline)}</p>
          <div class="tags">${(p.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          <div class="card-actions">
            ${p.site ? `
            <a class="btn" href="${esc(p.site.url)}" target="_blank" rel="noopener">${esc(p.site.label || "Open the site")} <span class="arr" aria-hidden="true">↗</span></a>
            <button class="btn ghost" type="button" data-open="${esc(p.id)}">Overview <span class="arr" aria-hidden="true">→</span></button>` : `
            <button class="btn" type="button" data-open="${esc(p.id)}">Key findings &amp; live demo <span class="arr" aria-hidden="true">→</span></button>`}
          </div>
        </div>
        <div class="card-stats">
          ${top.map((s) => `<div class="card-stat"><strong class="num">${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join("")}
        </div>
      </article>`;
  }

  function postCard(w) {
    return `
      <a class="post" href="${esc(w.url)}" target="_blank" rel="noopener">
        <div class="meta eyebrow"><span>${esc(w.topic || "Essay")}</span><span class="num">${fmtDate(w.date)}</span></div>
        <h3>${esc(w.title)}</h3>
        ${w.subtitle ? `<p>${esc(w.subtitle)}</p>` : ""}
        <span class="go">Read on Substack <span class="arr" aria-hidden="true">↗</span></span>
      </a>`;
  }

  function renderHome(section) {
    const more = S.more || [];
    const latest = S.writing[0];
    $("#main").innerHTML = `
      ${heroHTML()}

      <section class="section" id="research" aria-labelledby="h-research">
        <div class="section-head">
          <div><span class="eyebrow">${S.papers.length} ${S.papers.length === 1 ? "paper" : "papers"}</span><h2 id="h-research">Research</h2></div>
          <p>Open a paper for its key findings, charts, method and the full text.</p>
        </div>
        <div class="papers">${S.papers.map(paperCard).join("")}</div>
      </section>

      ${(S.projects || []).length ? `
      <section class="section" id="projects" aria-labelledby="h-projects">
        <div class="section-head">
          <div><span class="eyebrow">${S.projects.length} ${S.projects.length === 1 ? "project" : "projects"} · built and running</span><h2 id="h-projects">Projects</h2></div>
          <p>Open a project for its findings, method, data sources and a live demo.</p>
        </div>
        <div class="papers">${S.projects.map(projectCard).join("")}</div>
      </section>` : ""}

      <section class="section" id="writing" aria-labelledby="h-writing">
        <div class="section-head">
          <div><span class="eyebrow">${S.writing.length} essays${latest ? " · latest " + fmtDate(latest.date) : ""}</span><h2 id="h-writing">Writing</h2></div>
          <p>Finance explained in plain language.</p>
        </div>
        <div class="substack-head">
          <p><b>${esc(S.substack.name)}.</b> ${esc(S.substack.tagline)}</p>
          <a class="btn" href="${esc(S.substack.url)}" target="_blank" rel="noopener">Visit the Substack <span class="arr" aria-hidden="true">↗</span></a>
        </div>
        <div class="posts">${S.writing.map(postCard).join("")}</div>
      </section>

      ${more.length ? `
      <section class="section" id="more" aria-labelledby="h-more">
        <div class="section-head"><h2 id="h-more">More</h2></div>
        <div class="more-list">
          ${more.map((m) => `
            <div class="more-item">
              <span class="eyebrow">${esc(m.kind || "")}${m.date ? " · " + esc(m.date) : ""}</span>

  /* ---------- Charts ---------- */
  const fmtVal = (v, unit) => (Number.isInteger(v) ? v : v.toFixed(2)).toString().replace("-", "−") + (unit || "");

  function scale(values) {
    const min = Math.min(0, ...values), max = Math.max(0, ...values);
    const span = max - min || 1;
    return (v) => ((v - min) / span) * 100;
  }
  function barRow(label, v, pos, unit, cls) {
    const z = pos(0), x = pos(v);
    const left = Math.min(z, x), width = Math.max(Math.abs(x - z), v === 0 ? 0 : 0.8);
    return `
      <div class="bar-row">
        <span class="lbl">${esc(label)}</span>
        <span class="track">
          <span class="fill ${cls || ""} ${v < 0 ? "neg" : ""}" style="left:${left}%;width:${width}%"></span>
          ${z > 0 ? `<span class="zero" style="left:${z}%"></span>` : ""}
        </span>
        <span class="val">${fmtVal(v, unit)}</span>
      </div>`;
  }
  function chartHTML(c) {
    let inner = "";
    if (c.type === "bars") {
      const pos = scale(c.rows.map((r) => r.value));
      inner = `<div class="bars">${c.rows.map((r) => barRow(r.label, r.value, pos, c.unit)).join("")}</div>`;
    } else if (c.type === "grouped") {
      const all = c.groups.flatMap((g) => g.values);
      const pos = scale(all);
      inner = `
        <div class="legend">${c.series.map((s, i) => `<span><i class="${i ? "s1" : ""}"></i>${esc(s)}</span>`).join("")}</div>
        <div class="bars">
          ${c.groups.map((g) => `
            <div class="group-label">${esc(g.label)}</div>
            ${g.values.map((v, i) => barRow(c.series[i], v, pos, c.unit, i ? "s1" : "")).join("")}
          `).join("")}
        </div>`;
    } else if (c.type === "matrix") {
      const max = Math.max(...c.rows.flatMap((r) => r.values)) || 1;
      inner = `
        <div class="matrix-wrap"><table class="matrix">
          <thead><tr><th></th>${c.columns.map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead>
          <tbody>
            ${c.rows.map((r) => {
              const best = Math.max(...r.values);
              return `<tr><th scope="row">${esc(r.label)}</th>${r.values.map((v) => {
                const pct = Math.round((v / max) * 38);
                return `<td class="${v === best && v > 0 ? "best" : ""}" style="background:color-mix(in srgb, var(--accent) ${pct}%, var(--bg))">${v}</td>`;
              }).join("")}</tr>`;
            }).join("")}
          </tbody>
        </table></div>`;
    }
    return `
      <figure class="chart" style="margin:0">
        <h4>${esc(c.title)}</h4>
        ${inner}
        ${c.caption ? `<figcaption class="cap">${esc(c.caption)}</figcaption>` : ""}
      </figure>`;
  }

  /* ---------- Company search: weekly library first, live API for everything else ---------- */
  function setupSearch(d, widget) {
    const input = $("#co-search"), list = $("#co-results"), status = $("#co-status");
    const base = d.library.replace(/[^/]*$/, "");          // folder of index.json
    const api = (d.searchApi || "").replace(/\/$/, "");
    let lib = { companies: [], skipped: [] }, items = [], active = -1, liveSeq = 0;
    const norm = (s) => String(s).toLowerCase().replace(/\b(limited|ltd|inc|corp|corporation|company|co|plc|the)\b\.?/g, " ").replace(/[^a-z0-9&]+/g, " ").trim();
    const tone = (v) => ({ "Strong Accumulate": "good", "Accumulate": "good", "Hold": "ok", "Avoid": "bad" }[v] || "");
    const setStatus = (msg, err) => { status.textContent = msg || ""; status.classList.toggle("err", !!err); };

    fetch(d.library, { cache: "no-cache" }).then((r) => r.json()).then((j) => {
      lib = j;
      $("#co-libinfo").textContent = `· ${j.companies.length} companies ready instantly (${(j.indices || []).join(" + ")}), updated ${fmtDate(j.updated)}`
        + (api ? " · any other listed company on request" : "");
      const fe = $("#co-featured");
      (d.featured || []).map((t) => j.companies.find((c) => c.t === t)).filter(Boolean).forEach((c, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chipbtn"; b.textContent = c.n.replace(/\s+(Limited|Ltd\.?|Inc\.?|Corporation|Corp\.?)$/i, "");
        b.addEventListener("click", () => openLibrary(c));
        fe.appendChild(b);
        if (i < d.featured.length - 1) fe.appendChild(document.createTextNode(" "));
      });
      const body = $("#co-covered-body");
      body.innerHTML = `<div class="cols">${j.companies.map((c) => `<div>${esc(c.n)} <span class="tk">${esc(c.t)}</span></div>`).join("")}</div>`
        + (j.skipped.length ? `<div class="skip"><b>Not included (${j.skipped.length})</b>, because their data could not be verified:<div class="cols">${j.skipped.map((s) => `<div title="${esc(s.why)}">${esc(s.n)}: ${esc(s.why)}</div>`).join("")}</div></div>` : "");
    }).catch(() => setStatus("The company library could not be loaded.", true));

    function matches(q) {
      const nq = norm(q), uq = q.trim().toUpperCase();
      if (!nq) return [];
      return lib.companies.map((c) => {
        const nn = norm(c.n), tk = c.t.toUpperCase();
        const score = tk === uq || tk.split(".")[0] === uq ? 0 : nn.startsWith(nq) ? 1
          : (" " + nn).includes(" " + nq) ? 2 : nn.includes(nq) || tk.startsWith(uq) ? 3 : 9;
        return { c, score };
      }).filter((m) => m.score < 9).sort((a, b) => a.score - b.score || a.c.n.localeCompare(b.c.n)).slice(0, 7).map((m) => m.c);
    }

    function render() {
      list.innerHTML = "";
      items.forEach((it, i) => {
        const li = document.createElement("li");
        li.setAttribute("role", "option"); li.id = "co-opt-" + i;
        li.setAttribute("aria-selected", String(i === active));
        if (it.kind === "lib") {
          li.innerHTML = `<span class="nm">${esc(it.c.n)}</span><span class="tk">${esc(it.c.t)}</span><span class="vd ${tone(it.c.v)}">${esc(it.c.v)} · ${it.c.s ?? "–"}</span>`;
        } else if (it.kind === "liveq") {
          li.className = "live"; li.innerHTML = `Search all listed companies for “${esc(it.q)}” →`;
        } else if (it.kind === "live") {
          li.innerHTML = `<span class="nm">${esc(it.r.name)}</span><span class="tk">${esc(it.r.ticker)}</span><span class="vd">Live · ${esc(it.r.coverage)}</span>`;
        } else {
          li.className = "note"; li.textContent = it.text;
        }
        if (it.kind !== "note") li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(it); });
        list.appendChild(li);
      });
      const open = items.length > 0;
      list.hidden = !open;
      input.setAttribute("aria-expanded", String(open));
      input.setAttribute("aria-activedescendant", active >= 0 ? "co-opt-" + active : "");
    }

    function update() {
      const q = input.value.trim();
      liveSeq++;
      active = -1;
      if (q.length < 2) { items = []; render(); return; }
      items = matches(q).map((c) => ({ kind: "lib", c }));
      // companies deliberately left out of the library: say why
      const nq = norm(q);
      (lib.skipped || []).filter((s) => norm(s.n).startsWith(nq) || s.t.toUpperCase().split(".")[0] === q.toUpperCase())
        .slice(0, 2).forEach((s) => items.push({ kind: "note", text: `${s.n} isn't in the library: ${s.why}.` }));
      if (api) items.push({ kind: "liveq", q });
      else if (!items.length) items.push({ kind: "note", text: "Not covered yet: the library includes S&P 100 and Nifty 50 companies whose data could be verified." });
      render();
    }

    async function liveSearch(q) {
      const seq = ++liveSeq;
      items = [{ kind: "note", text: `Searching all listed companies for “${q}”… (the first search can take up to a minute)` }];
      render();
      try {
        const r = await fetch(`${api}/api/search?q=${encodeURIComponent(q)}`);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const res = await r.json();
        if (seq !== liveSeq) return;
        items = res.length ? res.map((x) => ({ kind: "live", r: x }))
          : [{ kind: "note", text: "No US, NSE or BSE listing found with that name. Try the official company name." }];
      } catch (e) {
        if (seq !== liveSeq) return;
        items = [{ kind: "note", text: "Live search is unavailable right now. Please try again later." }];
      }
      active = items[0] && items[0].kind !== "note" ? 0 : -1;
      render();
    }

    function openLibrary(c) {
      close();
      input.value = c.n;
      widget.setAttribute("src", base + c.f + "?d=" + encodeURIComponent(c.d));
      setStatus(`${c.n}: from the weekly library, data as of ${fmtDate(c.d)}.`);
    }

    async function openLive(r) {
      close();
      input.value = r.name;
      const lib = lib_find(r.ticker);
      if (lib) return openLibrary(lib);
      setStatus(`Building a live report for ${r.name} from its filings… this usually takes 10-30 seconds (up to a minute if the server was asleep).`);
      try {
        const res = await fetch(`${api}/api/report?ticker=${encodeURIComponent(r.ticker)}`);
        const j = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(j.detail || "HTTP " + res.status);
        widget.data = j;
        const v = j.verification || {};
        const how = v.primary === "SEC EDGAR" ? "official SEC filings"
          : v.verified > 0 ? `${v.primary}, cross-checked against Yahoo Finance`
          : `${v.primary || "public data"} only (a second source wasn't available to cross-check)`;
        setStatus(`${j.company.name}: live report from ${how}. Not saved.`);
      } catch (e) {
        setStatus(`Couldn't build a report for ${r.name}: ${e.message}`, true);
      }
    }
    const lib_find = (t) => lib.companies.find((c) => c.t.toUpperCase() === String(t).toUpperCase());

    function choose(it) {
      if (it.kind === "lib") openLibrary(it.c);
      else if (it.kind === "liveq") liveSearch(it.q);
      else if (it.kind === "live") openLive(it.r);
    }
    function close() { items = []; active = -1; render(); }

    input.addEventListener("input", update);
    input.addEventListener("focus", update);
    input.addEventListener("blur", () => setTimeout(close, 120));
    input.addEventListener("keydown", (e) => {
      const n = items.length;
      if (e.key === "ArrowDown" && n) { e.preventDefault(); active = (active + 1) % n; render(); }
      else if (e.key === "ArrowUp" && n) { e.preventDefault(); active = (active - 1 + n) % n; render(); }
      else if (e.key === "Enter") {
        e.preventDefault();
        const it = items[active >= 0 ? active : 0];
        if (it && it.kind !== "note") choose(it);
      } else if (e.key === "Escape") close();
    });
  }

  /* ---------- PDF reader (pdf.js, loaded only when a paper is opened) ---------- */
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfReady;
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  function loadPdfJs() {
    // Loading the worker script first lets pdf.js run in the page, which works inside sandboxed frames.
    pdfReady = pdfReady || loadScript(PDFJS + "pdf.worker.min.js")
      .then(() => loadScript(PDFJS + "pdf.min.js"))
      .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; return window.pdfjsLib; });
    return pdfReady;
  }
  let renderToken = 0;
  async function renderPdf(url, frame) {
    const token = ++renderToken;
    try {
      const lib = await loadPdfJs();
      const doc = await lib.getDocument(url).promise;
      if (token !== renderToken) return;
      frame.innerHTML = "";
      const first = await doc.getPage(1);
      const vp1 = first.getViewport({ scale: 1 });
      const slots = [];
      for (let i = 1; i <= doc.numPages; i++) {
        const slot = document.createElement("div");
        slot.className = "page-slot";
        slot.style.aspectRatio = `${vp1.width} / ${vp1.height}`;
        slot.dataset.page = i;
        slot.innerHTML = `<span class="pno">${i} / ${doc.numPages}</span>`;
        frame.appendChild(slot);
        slots.push(slot);
      }
      const draw = async (slot) => {
        if (slot.dataset.done) return;
        slot.dataset.done = "1";
        const page = await doc.getPage(+slot.dataset.page);
        const base = page.getViewport({ scale: 1 });
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const vp = page.getViewport({ scale: (slot.clientWidth / base.width) * ratio });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        slot.style.aspectRatio = `${base.width} / ${base.height}`;
        slot.prepend(canvas);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      };
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { io.unobserve(e.target); draw(e.target); } });
        }, { root: frame, rootMargin: "600px 0px" });
        slots.forEach((s) => io.observe(s));
      } else slots.forEach(draw);
    } catch (err) {
      if (token !== renderToken) return;
      frame.innerHTML = `<div class="reader-note">The paper couldn't be displayed here. Use “Open PDF in a new tab” above to read it.</div>`;
    }
  }

  /* ---------- Market data from Market Matters (hero line) ---------- */
  let marketP;
  function marketData() {
    const m = S.market;
    if (!m || !m.data) return Promise.reject(new Error("no market source"));
    marketP = marketP || fetch(m.data, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
    return marketP;
  }
  const sign = (p) => (p > 0 ? "+" : p < 0 ? "−" : "");
  const pctTxt = (p) => (p == null ? "–" : sign(p) + Math.abs(p).toFixed(2) + "%");
  const toneOf = (p) => (p == null || Math.abs(p) < 0.005 ? "flat" : p > 0 ? "up" : "down");
  const numTxt = (x, d = 2) => Number(x).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
  const shortDay = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });

  function heroHTML() {
    const p = S.profile, P = S.projects || [];
    const site = P.find((x) => x.site);
    const [first, ...rest] = p.name.split(" ");
    const stats = [
      { v: String(S.papers.length), l: S.papers.length === 1 ? "research paper" : "research papers" },
      { v: String(P.length), l: P.length === 1 ? "live project" : "live projects" },
      { v: String(S.writing.length), l: "essays on Substack" },
      ...(p.heroStat ? [{ v: p.heroStat.value, l: p.heroStat.label }] : []),
    ];
    return `
      <section class="hero" aria-label="Introduction">
        <div class="hero-top">
          <div class="hero-copy">
            <span class="hero-tag">${esc(p.roles.join(" · "))}</span>
            <h2>${esc(first)} <span class="soft">${esc(rest.join(" "))}</span></h2>
            <p class="pitch">${esc(p.bio)}</p>
            <div class="hero-actions">
              <button class="btn" type="button" data-go="research">Explore the research <span class="arr" aria-hidden="true">→</span></button>
              ${P.length ? `<button class="btn ghost" type="button" data-go="projects">Projects</button>` : ""}
              ${site ? `<a class="btn ghost" href="${esc(site.site.url)}" target="_blank" rel="noopener">${esc(site.shortTitle || "Live site")} <span class="arr" aria-hidden="true">↗</span></a>` : ""}
            </div>
          </div>
          ${S.market && S.market.data ? `<div class="hero-chart" id="hero-chart" aria-live="polite">
            <div class="hero-chart-head"><span class="eyebrow">Nifty 50 · last close</span></div>
            <svg viewBox="0 0 600 150" preserveAspectRatio="none" aria-hidden="true"><line class="gridline" x1="0" x2="600" y1="37" y2="37"/><line class="gridline" x1="0" x2="600" y1="75" y2="75"/><line class="gridline" x1="0" x2="600" y1="113" y2="113"/></svg>
            <div class="foot"><span>Loading market data…</span></div>
          </div>` : ""}
        </div>
        <div class="hero-stats">
          ${stats.map((s) => `<div><strong class="num">${esc(s.v)}</strong><span>${esc(s.l)}</span></div>`).join("")}
        </div>
      </section>`;
  }

  function drawHeroChart() {
    const box = $("#hero-chart");
    if (!box) return;
    marketData().then((d) => {
      const pts = (d.nifty_trend || []).filter((x) => x && x.c != null);
      const nifty = (d.indices || []).find((x) => x.key === "nifty");
      if (pts.length < 2 || !nifty || !document.body.contains(box)) throw new Error("no trend");
      const W = 600, H = 150, pad = 12;
      const v = pts.map((x) => x.c), lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
      const xy = v.map((c, i) => [(i / (v.length - 1)) * W, pad + (1 - (c - lo) / span) * (H - 2 * pad)]);
      const line = xy.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
      const [ex, ey] = xy[xy.length - 1];
      const up = v[v.length - 1] >= v[0];
      const chg = ((v[v.length - 1] / v[0]) - 1) * 100;
      box.innerHTML = `
        <div class="hero-chart-head">
          <span class="eyebrow">Nifty 50 · ${esc(shortDay(d.market_date))} close</span>
          <span><span class="big num">${numTxt(nifty.last)}</span> <span class="num ${toneOf(nifty.pct)}">${pctTxt(nifty.pct)}</span></span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Nifty 50 closing prices over the last ${v.length} sessions, ${up ? "up" : "down"} ${Math.abs(chg).toFixed(1)}%">
          <defs><linearGradient id="heroFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--accent)" stop-opacity=".28"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></linearGradient></defs>
          <line class="gridline" x1="0" x2="${W}" y1="${H * .25}" y2="${H * .25}"/><line class="gridline" x1="0" x2="${W}" y1="${H * .5}" y2="${H * .5}"/><line class="gridline" x1="0" x2="${W}" y1="${H * .75}" y2="${H * .75}"/>
          <path class="area" d="${line} L${W} ${H} L0 ${H} Z"/>
          <path class="line" d="${line}" pathLength="1"/>
          <circle class="end-ring" cx="${ex}" cy="${ey}" r="4"/>
          <circle class="end" cx="${ex}" cy="${ey}" r="4"/>
        </svg>
        <div class="foot"><span>${v.length} sessions · ${chg >= 0 ? "+" : "−"}${Math.abs(chg).toFixed(1)}% · range ${numTxt(lo, 0)}–${numTxt(hi, 0)}</span><a href="${esc(S.market.url)}" target="_blank" rel="noopener">via ${esc(S.market.name || "Market Matters")} ↗</a></div>`;
    }).catch(() => {
      if (!document.body.contains(box)) return;
      box.remove();
      const top = $(".hero-top");
      if (top) top.style.gridTemplateColumns = "minmax(0, 1fr)";
    });
  }

  /* ---------- Motion: reveal on scroll, count-up numbers, pointer spotlight ---------- */
  function countUp(el) {
    const txt = el.dataset.final;
    const m = /^([^\d]*?)(\d[\d,]*(?:\.\d+)?)(.*)$/s.exec(txt || "");
    if (!m) return;
    const target = parseFloat(m[2].replace(/,/g, ""));
    const dec = (m[2].split(".")[1] || "").length, commas = m[2].includes(",");
    const fmt = (x) => { const s = x.toFixed(dec); return commas ? Number(s).toLocaleString("en-IN", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : s; };
    const t0 = performance.now(), dur = 1100;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = m[1] + fmt(target * e) + m[3];
      if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
    };
    requestAnimationFrame(step);
  }

  let io;
  function enhance(root) {
    root.classList.remove("view-enter"); void root.offsetWidth; root.classList.add("view-enter");
    root.querySelectorAll(".paper-card, .post").forEach((el) => el.addEventListener("pointermove", (e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px"); el.style.setProperty("--my", (e.clientY - r.top) + "px");
    }));
    if (!ANIM) return;
    const targets = root.querySelectorAll(".section-head, .substack-head, .paper-card, .post, .more-item, .question, .stat-row, .detail .block:not(.demo), .site-cta, .chart");
    targets.forEach((el) => el.classList.add("reveal"));
    root.querySelectorAll(".papers, .posts, .charts, .more-list").forEach((g) =>
      [...g.children].forEach((c, i) => c.style.setProperty("--d", Math.min(i, 5) * 80 + "ms")));
    root.querySelectorAll(".chart").forEach((c) => {
      c.querySelectorAll(".fill").forEach((f, i) => f.style.setProperty("--d", i * 60 + "ms"));
      c.querySelectorAll(".matrix td").forEach((td, i) => td.style.setProperty("--d", 200 + i * 40 + "ms"));
    });
    const nums = root.querySelectorAll(".card-stat strong, .stat-row strong, .hero-stats strong");
    nums.forEach((n) => { n.dataset.final = n.textContent; });
    if (io) io.disconnect();
    io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      if (en.target.matches("strong")) countUp(en.target); else en.target.classList.add("in");
    }), { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    targets.forEach((el) => io.observe(el));
    nums.forEach((n) => io.observe(n));
    // never leave anything hidden if an observer is slow to fire
    setTimeout(() => targets.forEach((el) => el.classList.add("in")), 4000);
  }

  /* ---------- Rail: highlight the section in view ---------- */
  function setCurrent(id) {
    $("#rail").querySelectorAll("[data-go]").forEach((b) => b.setAttribute("aria-current", b.dataset.go === id ? "true" : "false"));
  }
  let spy;
  function spyOnSections() {
    if (spy) spy.disconnect();
    if (!("IntersectionObserver" in window)) return;
    const seen = new Map();
    spy = new IntersectionObserver((entries) => {
      entries.forEach((e) => seen.set(e.target.id, e.isIntersecting ? e.intersectionRatio : 0));
      let best = null, ratio = 0;
      seen.forEach((r, id) => { if (r > ratio) { ratio = r; best = id; } });
      if (best) setCurrent(best);
    }, { rootMargin: "-30% 0px -55% 0px", threshold: [0, 0.01, 0.25, 0.5] });
    SECTIONS.forEach((id) => { const s = document.getElementById(id); if (s) spy.observe(s); });
  }

  /* ---------- Routing ---------- */
  const SECTIONS = ["research", "projects", "writing", "more"];
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const paper = S.papers.find((p) => p.id === h);
    const project = (S.projects || []).find((p) => p.id === h);
    if (paper) { renderPaper(paper); document.title = paper.shortTitle + " · " + S.profile.name; }
    else if (project) { renderProject(project); document.title = (project.shortTitle || project.title) + " · " + S.profile.name; }
    else { renderHome(SECTIONS.includes(h) ? h : null); document.title = S.profile.name + " Research"; }
  }
  function openPaper(id) { location.hash = id; }
  function go(section) {
    if (location.hash.slice(1) === section) route();
    else location.hash = section;
  }
  window.addEventListener("hashchange", route);
  renderRail();
  route();
})();
</script>
