<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manisha Hebbar Research</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Research papers, key findings and writing by Manisha Hebbar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: a fixed profile rail on the left (stacks on top on phones) and a working area
   on the right: research cards that open into factsheet-style paper pages, then writing. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #151821;
  --muted: #5b6172;
  --line: #dcdfe7;
  --accent: #2f3fb8;
  --accent-soft: #e6e9fb;
  --gold: #b97a0e;
  --gold-soft: #fbf0db;
  --neg: #b4413c;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --rail: 300px;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --surface: #171a23; --ink: #e8eaf1; --muted: #9ba1b0; --line: #2a2e3b;
    --accent: #8f9cff; --accent-soft: #23284a; --gold: #e3ad48; --gold-soft: #3a2f17; --neg: #e47d76;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #171a23; --ink: #e8eaf1; --muted: #9ba1b0; --line: #2a2e3b;
  --accent: #8f9cff; --accent-soft: #23284a; --gold: #e3ad48; --gold-soft: #3a2f17; --neg: #e47d76;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.eyebrow {
  font: 500 11.5px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.num { font-variant-numeric: tabular-nums; }

.shell {
  display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
  max-width: 1280px; margin: 0 auto; min-height: 100vh;
}

/* ---------- Profile rail ---------- */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  padding-block: 40px 28px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: 28px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px;
}
.monogram {
  width: 52px; height: 52px; border-radius: 50%; flex: none; align-self: flex-start;
  display: grid; place-items: center;
  background: var(--accent); color: var(--surface);
  font: 600 20px/1 var(--f-display);
}
.rail h1 { font-size: 30px; line-height: 1.1; }
.rail .headline { color: var(--muted); margin-top: 6px; }
.rail .roles { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.rail .bio { font-size: 14px; color: var(--ink); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12.5px; padding: 3px 9px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted); background: var(--surface);
}
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.nav button {
  all: unset; cursor: pointer; display: flex; justify-content: space-between;
  padding: 7px 10px; margin-inline: -10px; border-radius: 6px; font-size: 14px;
}
.nav button:hover { background: var(--accent-soft); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .count { font: 500 12px var(--f-mono); color: var(--muted); }
.contact { display: flex; flex-direction: column; gap: 8px; margin-top: auto; font-size: 13.5px; }
.contact-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.email { font-family: var(--f-mono); font-size: 12.5px; user-select: all; overflow-wrap: anywhere; }
.copy {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer;
}
.copy:hover { border-color: var(--accent); }
.links { display: flex; gap: 14px; flex-wrap: wrap; }

/* ---------- Main ---------- */
main {
  min-width: 0;
  padding-block: 40px 80px;
  padding-left: 48px; padding-right: max(48px, env(safe-area-inset-right, 0px));
}
.section { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 24px; }
.section + .section { margin-top: 56px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 24px; }
.section-head p { margin: 0; color: var(--muted); font-size: 14px; }

.summary {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.summary > div { padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.summary > div + div { border-left: 1px solid var(--line); }
.summary strong { font: 600 26px/1.1 var(--f-display); }
.summary span { font-size: 13px; color: var(--muted); }

/* Research cards */
.papers { display: flex; flex-direction: column; gap: 14px; }
.paper-card {
  display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 28px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px 26px; cursor: pointer; transition: border-color .15s, transform .15s;
}
.paper-card:hover { border-color: var(--accent); }
.paper-card .body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.paper-card h3 { font-size: 21px; line-height: 1.25; }
.paper-card .headline { margin: 0; color: var(--ink); }
.paper-card .meta { display: flex; gap: 10px; flex-wrap: wrap; }
.paper-card .meta span + span::before { content: "·"; margin-right: 10px; color: var(--line); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 2px 8px; }
.card-stats { display: flex; flex-direction: column; gap: 14px; border-left: 1px solid var(--line); padding-left: 24px; }
.card-stat strong { display: block; font: 600 24px/1.1 var(--f-display); color: var(--accent); }
.card-stat span { font-size: 12.5px; color: var(--muted); line-height: 1.4; display: block; }
.card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  border-radius: 7px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.08); }

/* Projects: cards reuse the research card styles; the live demo sits on the project page */
.demo { display: flex; flex-direction: column; gap: 12px; }
.demo-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.switch { display: flex; gap: 6px; flex-wrap: wrap; }
.switch button {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  border-radius: 99px; padding: 5px 13px; font-size: 13.5px; font-weight: 500;
}
.switch button:hover { border-color: var(--accent); }
.switch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.demo .cap { margin: 0; font-size: 13px; color: var(--muted); max-width: 80ch; }
/* company search */
.search { position: relative; max-width: 640px; }
.search input {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px 11px 38px;
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search ul {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px;
  list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,.18); max-height: 360px; overflow-y: auto;
}
.search li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.search li[aria-selected="true"], .search li:hover { background: var(--accent-soft); }
.search li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search li .tk { font: 500 12px var(--f-mono); color: var(--muted); }
.search li .vd { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.search li .vd.good { color: #2e9d4f; } .search li .vd.ok { color: var(--gold); } .search li .vd.bad { color: var(--neg); }
.search li.live { color: var(--accent); font-weight: 500; }
.search li.note { cursor: default; color: var(--muted); font-size: 13px; }
.search li.note:hover { background: none; }
.search-meta { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.chipbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.chipbtn:hover { border-color: var(--accent); }
.search-status { font-size: 13.5px; color: var(--muted); min-height: 1.4em; }
.search-status.err { color: var(--neg); }
.covered { font-size: 13px; color: var(--muted); }
.covered summary { cursor: pointer; color: var(--accent); }
.covered .cols { columns: 3 220px; margin-top: 10px; }
.covered .cols div { break-inside: avoid; padding: 2px 0; }
.covered .skip { margin-top: 10px; }
.demo fin-spider { display: block; --fs-font: var(--f-body); --fs-mono: var(--f-mono); }
.source-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.source-list li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; }
.source-list li::before { content: ""; width: 6px; height: 6px; margin-top: 9px; border-radius: 50%; background: var(--muted); }

/* Writing */
.substack-head {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 18px 22px; border-radius: var(--radius); background: var(--accent-soft);
}
.substack-head p { margin: 0; max-width: 60ch; font-size: 14px; }
.posts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.post {
  display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
  transition: border-color .15s;
}
.post:hover { border-color: var(--accent); }
.post h3 { font-size: 17.5px; line-height: 1.3; }
.post p { margin: 0; color: var(--muted); font-size: 14px; }
.post .meta { display: flex; justify-content: space-between; gap: 8px; }
.post .go { margin-top: auto; font-size: 13px; color: var(--accent); font-weight: 500; }

.more-list { display: flex; flex-direction: column; gap: 12px; }
.more-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.more-item h3 { font-size: 17px; }
.more-item p { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- Paper detail ---------- */
.detail { display: flex; flex-direction: column; gap: 36px; }
.back {
  all: unset; cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 500; align-self: flex-start;
}
.back:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.detail-head { display: flex; flex-direction: column; gap: 12px; max-width: 860px; }
.detail-head h2 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; }
.byline { color: var(--muted); font-size: 14px; }
.byline b { color: var(--ink); font-weight: 600; }
.question {
  border-left: 3px solid var(--gold); background: var(--gold-soft);
  padding: 14px 18px; border-radius: 0 8px 8px 0; max-width: 860px;
}
.question p { margin: 4px 0 0; font: 500 17px/1.5 var(--f-display); }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-block: 1px solid var(--line); }
.stat-row > div { padding: 16px 18px 16px 0; display: flex; flex-direction: column; gap: 6px; }
.stat-row > div + div { padding-left: 18px; border-left: 1px solid var(--line); }
.stat-row strong { font: 600 30px/1 var(--f-display); color: var(--accent); }
.stat-row span { font-size: 13px; color: var(--muted); line-height: 1.4; }

.two-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.block { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.block h3 { font-size: 20px; }
.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.findings li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 14px; line-height: 1.55; }
.findings li::before { content: ""; width: 8px; height: 8px; margin-top: 8px; background: var(--accent); border-radius: 2px; }
.factsheet { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.factsheet div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 11px 16px; }
.factsheet div + div { border-top: 1px solid var(--line); }
.factsheet dt { font: 500 11.5px/1.6 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.factsheet dd { margin: 0; font-size: 14px; }
.abstract { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 70ch; }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chart h4 { margin: 0; font: 600 15px/1.35 var(--f-body); }
.chart .cap { margin: 0; font-size: 12.5px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr) 58px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .lbl { color: var(--ink); line-height: 1.25; }
.bar-row .val { font: 500 12.5px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 14px; background: var(--bg); border-radius: 3px; }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.fill.s1 { background: var(--gold); }
.fill.neg { background: var(--neg); }
.zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--accent); }
.legend i.s1 { background: var(--gold); }
.group-label { font: 500 11.5px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.matrix-wrap { overflow-x: auto; }
.matrix { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 13px; }
.matrix th { font-weight: 500; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 4px; }
.matrix th[scope="row"] { text-align: left; color: var(--ink); font-size: 13px; white-space: nowrap; padding-right: 8px; }
.matrix td {
  text-align: center; padding: 9px 4px; border-radius: 5px; font: 500 14px var(--f-mono);
  font-variant-numeric: tabular-nums; border: 2px solid transparent;
}
.matrix td.best { border-color: var(--gold); }

.reader { display: flex; flex-direction: column; gap: 12px; }
.reader-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.reader-frame {
  max-height: 85vh; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 14px; align-items: center;
}
.page-slot { width: 100%; max-width: 820px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); position: relative; }
.page-slot canvas { display: block; width: 100%; height: auto; }
.page-slot .pno { position: absolute; right: 8px; bottom: 6px; font: 500 11px var(--f-mono); color: #777; }
.reader-note { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }

.footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .paper-card { grid-template-columns: minmax(0, 1fr); }
  .card-stats { border-left: 0; padding-left: 0; flex-direction: row; flex-wrap: wrap; gap: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
  .card-stat { flex: 1 1 160px; }
  .two-col { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: static; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line);
    padding-block: 28px 22px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .nav button { margin-inline: 0; border: 1px solid var(--line); gap: 8px; }
  .contact { margin-top: 0; }
  main { padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .posts { grid-template-columns: minmax(0, 1fr); }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary > div:nth-child(3) { border-left: 0; }
  .summary > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-row > div:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat-row > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .paper-card { padding: 20px; }
  .reader-frame { padding: 8px; }
}
@media (max-width: 520px) {
  .summary { grid-template-columns: minmax(0, 1fr); }
  .summary > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .bar-row { grid-template-columns: minmax(0, 1fr) 56px; }
  .bar-row .lbl { grid-column: 1 / -1; }
  .factsheet div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>

<script src="content.js?v=4"></script>
<script>
(function () {
  const S = window.SITE;
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (iso) => {
    const d = new Date(iso + "T00:00:00");
    return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  };
  const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("");

  /* ---------- Rail ---------- */
  function renderRail() {
    const p = S.profile;
    const more = (S.more || []).length;
    $("#rail").innerHTML = `
      <div class="monogram" aria-hidden="true">${esc(initials(p.name))}</div>
      <div>
        <h1>${esc(p.name)}</h1>
        <div class="headline">${esc(p.headline)}</div>
      </div>
      <div class="roles">
        ${p.roles.map((r) => `<span>${esc(r)}</span>`).join("")}
        <span style="color:var(--muted)">${esc(p.institution)}</span>
      </div>
      <p class="bio">${esc(p.bio)}</p>
      <div class="chips">${p.focus.map((f) => `<span class="chip">${esc(f)}</span>`).join("")}</div>
      <nav class="nav" aria-label="Sections">
        <button data-go="research">Research <span class="count">${S.papers.length}</span></button>

  /* ---------- Charts ---------- */
  const fmtVal = (v, unit) => (Number.isInteger(v) ? v : v.toFixed(2)).toString().replace("-", "−") + (unit || "");

  function scale(values) {
    const min = Math.min(0, ...values), max = Math.max(0, ...values);
    const span = max - min || 1;
    return (v) => ((v - min) / span) * 100;
  }
  function barRow(label, v, pos, unit, cls) {
    const z = pos(0), x = pos(v);
    const left = Math.min(z, x), width = Math.max(Math.abs(x - z), v === 0 ? 0 : 0.8);
    return `
      <div class="bar-row">
        <span class="lbl">${esc(label)}</span>
        <span class="track">
          <span class="fill ${cls || ""} ${v < 0 ? "neg" : ""}" style="left:${left}%;width:${width}%"></span>
          ${z > 0 ? `<span class="zero" style="left:${z}%"></span>` : ""}
        </span>
        <span class="val">${fmtVal(v, unit)}</span>
      </div>`;
  }
  function chartHTML(c) {
    let inner = "";
    if (c.type === "bars") {
      const pos = scale(c.rows.map((r) => r.value));
      inner = `<div class="bars">${c.rows.map((r) => barRow(r.label, r.value, pos, c.unit)).join("")}</div>`;
    } else if (c.type === "grouped") {
      const all = c.groups.flatMap((g) => g.values);
      const pos = scale(all);
      inner = `
        <div class="legend">${c.series.map((s, i) => `<span><i class="${i ? "s1" : ""}"></i>${esc(s)}</span>`).join("")}</div>
        <div class="bars">
          ${c.groups.map((g) => `
            <div class="group-label">${esc(g.label)}</div>
            ${g.values.map((v, i) => barRow(c.series[i], v, pos, c.unit, i ? "s1" : "")).join("")}
          `).join("")}
        </div>`;
    } else if (c.type === "matrix") {
      const max = Math.max(...c.rows.flatMap((r) => r.values)) || 1;
      inner = `
        <div class="matrix-wrap"><table class="matrix">
          <thead><tr><th></th>${c.columns.map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead>
          <tbody>
            ${c.rows.map((r) => {
              const best = Math.max(...r.values);
              return `<tr><th scope="row">${esc(r.label)}</th>${r.values.map((v) => {
                const pct = Math.round((v / max) * 38);
                return `<td class="${v === best && v > 0 ? "best" : ""}" style="background:color-mix(in srgb, var(--accent) ${pct}%, var(--bg))">${v}</td>`;
              }).join("")}</tr>`;
            }).join("")}
          </tbody>
        </table></div>`;
    }
    return `
      <figure class="chart" style="margin:0">
        <h4>${esc(c.title)}</h4>
        ${inner}
        ${c.caption ? `<figcaption class="cap">${esc(c.caption)}</figcaption>` : ""}
      </figure>`;
  }

  /* ---------- Company search: weekly library first, live API for everything else ---------- */
  function setupSearch(d, widget) {
    const input = $("#co-search"), list = $("#co-results"), status = $("#co-status");
    const base = d.library.replace(/[^/]*$/, "");          // folder of index.json
    const api = (d.searchApi || "").replace(/\/$/, "");
    let lib = { companies: [], skipped: [] }, items = [], active = -1, liveSeq = 0;
    const norm = (s) => String(s).toLowerCase().replace(/\b(limited|ltd|inc|corp|corporation|company|co|plc|the)\b\.?/g, " ").replace(/[^a-z0-9&]+/g, " ").trim();
    const tone = (v) => ({ "Strong Accumulate": "good", "Accumulate": "good", "Hold": "ok", "Avoid": "bad" }[v] || "");
    const setStatus = (msg, err) => { status.textContent = msg || ""; status.classList.toggle("err", !!err); };

    fetch(d.library, { cache: "no-cache" }).then((r) => r.json()).then((j) => {
      lib = j;
      $("#co-libinfo").textContent = `· ${j.companies.length} companies ready instantly (${(j.indices || []).join(" + ")}), updated ${fmtDate(j.updated)}`
        + (api ? " · any other listed company on request" : "");
      const fe = $("#co-featured");
      (d.featured || []).map((t) => j.companies.find((c) => c.t === t)).filter(Boolean).forEach((c, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chipbtn"; b.textContent = c.n.replace(/\s+(Limited|Ltd\.?|Inc\.?|Corporation|Corp\.?)$/i, "");
        b.addEventListener("click", () => openLibrary(c));
        fe.appendChild(b);
        if (i < d.featured.length - 1) fe.appendChild(document.createTextNode(" "));
      });
      const body = $("#co-covered-body");
      body.innerHTML = `<div class="cols">${j.companies.map((c) => `<div>${esc(c.n)} <span class="tk">${esc(c.t)}</span></div>`).join("")}</div>`
        + (j.skipped.length ? `<div class="skip"><b>Not included (${j.skipped.length})</b>, because their data could not be verified:<div class="cols">${j.skipped.map((s) => `<div title="${esc(s.why)}">${esc(s.n)}: ${esc(s.why)}</div>`).join("")}</div></div>` : "");
    }).catch(() => setStatus("The company library could not be loaded.", true));

    function matches(q) {
      const nq = norm(q), uq = q.trim().toUpperCase();
      if (!nq) return [];
      return lib.companies.map((c) => {
        const nn = norm(c.n), tk = c.t.toUpperCase();
        const score = tk === uq || tk.split(".")[0] === uq ? 0 : nn.startsWith(nq) ? 1
          : (" " + nn).includes(" " + nq) ? 2 : nn.includes(nq) || tk.startsWith(uq) ? 3 : 9;
        return { c, score };
      }).filter((m) => m.score < 9).sort((a, b) => a.score - b.score || a.c.n.localeCompare(b.c.n)).slice(0, 7).map((m) => m.c);
    }

    function render() {
      list.innerHTML = "";
      items.forEach((it, i) => {
        const li = document.createElement("li");
        li.setAttribute("role", "option"); li.id = "co-opt-" + i;
        li.setAttribute("aria-selected", String(i === active));
        if (it.kind === "lib") {
          li.innerHTML = `<span class="nm">${esc(it.c.n)}</span><span class="tk">${esc(it.c.t)}</span><span class="vd ${tone(it.c.v)}">${esc(it.c.v)} · ${it.c.s ?? "–"}</span>`;
        } else if (it.kind === "liveq") {
          li.className = "live"; li.innerHTML = `Search all listed companies for “${esc(it.q)}” →`;
        } else if (it.kind === "live") {
          li.innerHTML = `<span class="nm">${esc(it.r.name)}</span><span class="tk">${esc(it.r.ticker)}</span><span class="vd">Live · ${esc(it.r.coverage)}</span>`;
        } else {
          li.className = "note"; li.textContent = it.text;
        }
        if (it.kind !== "note") li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(it); });
        list.appendChild(li);
      });
      const open = items.length > 0;
      list.hidden = !open;
      input.setAttribute("aria-expanded", String(open));
      input.setAttribute("aria-activedescendant", active >= 0 ? "co-opt-" + active : "");
    }

    function update() {
      const q = input.value.trim();
      liveSeq++;
      active = -1;
      if (q.length < 2) { items = []; render(); return; }
      items = matches(q).map((c) => ({ kind: "lib", c }));
      // companies deliberately left out of the library: say why
      const nq = norm(q);
      (lib.skipped || []).filter((s) => norm(s.n).startsWith(nq) || s.t.toUpperCase().split(".")[0] === q.toUpperCase())
        .slice(0, 2).forEach((s) => items.push({ kind: "note", text: `${s.n} isn't in the library: ${s.why}.` }));
      if (api) items.push({ kind: "liveq", q });
      else if (!items.length) items.push({ kind: "note", text: "Not in the library. Live search for other companies isn't switched on yet." });
      render();
    }

    async function liveSearch(q) {
      const seq = ++liveSeq;
      items = [{ kind: "note", text: `Searching all listed companies for “${q}”… (the first search can take up to a minute)` }];
      render();
      try {
        const r = await fetch(`${api}/api/search?q=${encodeURIComponent(q)}`);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const res = await r.json();
        if (seq !== liveSeq) return;
        items = res.length ? res.map((x) => ({ kind: "live", r: x }))
          : [{ kind: "note", text: "No US, NSE or BSE listing found with that name. Try the official company name." }];
      } catch (e) {
        if (seq !== liveSeq) return;
        items = [{ kind: "note", text: "Live search is unavailable right now. Please try again later." }];
      }
      active = items[0] && items[0].kind !== "note" ? 0 : -1;
      render();
    }

    function openLibrary(c) {
      close();
      input.value = c.n;
      widget.setAttribute("src", base + c.f + "?d=" + encodeURIComponent(c.d));
      setStatus(`${c.n}: from the weekly library, data as of ${fmtDate(c.d)}.`);
    }

    async function openLive(r) {
      close();
      input.value = r.name;
      const lib = lib_find(r.ticker);
      if (lib) return openLibrary(lib);
      setStatus(`Building a live report for ${r.name} from its filings… this usually takes 10-30 seconds (up to a minute if the server was asleep).`);
      try {
        const res = await fetch(`${api}/api/report?ticker=${encodeURIComponent(r.ticker)}`);
        const j = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(j.detail || "HTTP " + res.status);
        widget.data = j;
        const v = j.verification || {};
        const how = v.primary === "SEC EDGAR" ? "official SEC filings"
          : v.verified > 0 ? `${v.primary}, cross-checked against Yahoo Finance`
          : `${v.primary || "public data"} only (a second source wasn't available to cross-check)`;
        setStatus(`${j.company.name}: live report from ${how}. Not saved.`);
      } catch (e) {
        setStatus(`Couldn't build a report for ${r.name}: ${e.message}`, true);
      }
    }
    const lib_find = (t) => lib.companies.find((c) => c.t.toUpperCase() === String(t).toUpperCase());

    function choose(it) {
      if (it.kind === "lib") openLibrary(it.c);
      else if (it.kind === "liveq") liveSearch(it.q);
      else if (it.kind === "live") openLive(it.r);
    }
    function close() { items = []; active = -1; render(); }

    input.addEventListener("input", update);
    input.addEventListener("focus", update);
    input.addEventListener("blur", () => setTimeout(close, 120));
    input.addEventListener("keydown", (e) => {
      const n = items.length;
      if (e.key === "ArrowDown" && n) { e.preventDefault(); active = (active + 1) % n; render(); }
      else if (e.key === "ArrowUp" && n) { e.preventDefault(); active = (active - 1 + n) % n; render(); }
      else if (e.key === "Enter") {
        e.preventDefault();
        const it = items[active >= 0 ? active : 0];
        if (it && it.kind !== "note") choose(it);
      } else if (e.key === "Escape") close();
    });
  }

  /* ---------- PDF reader (pdf.js, loaded only when a paper is opened) ---------- */
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfReady;
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  function loadPdfJs() {
    // Loading the worker script first lets pdf.js run in the page, which works inside sandboxed frames.
    pdfReady = pdfReady || loadScript(PDFJS + "pdf.worker.min.js")
      .then(() => loadScript(PDFJS + "pdf.min.js"))
      .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; return window.pdfjsLib; });
    return pdfReady;
  }
  let renderToken = 0;
  async function renderPdf(url, frame) {
    const token = ++renderToken;
    try {
      const lib = await loadPdfJs();
      const doc = await lib.getDocument(url).promise;
      if (token !== renderToken) return;
      frame.innerHTML = "";
      const first = await doc.getPage(1);
      const vp1 = first.getViewport({ scale: 1 });
      const slots = [];
      for (let i = 1; i <= doc.numPages; i++) {
        const slot = document.createElement("div");
        slot.className = "page-slot";
        slot.style.aspectRatio = `${vp1.width} / ${vp1.height}`;
        slot.dataset.page = i;
        slot.innerHTML = `<span class="pno">${i} / ${doc.numPages}</span>`;
        frame.appendChild(slot);
        slots.push(slot);
      }
      const draw = async (slot) => {
        if (slot.dataset.done) return;
        slot.dataset.done = "1";
        const page = await doc.getPage(+slot.dataset.page);
        const base = page.getViewport({ scale: 1 });
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const vp = page.getViewport({ scale: (slot.clientWidth / base.width) * ratio });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        slot.style.aspectRatio = `${base.width} / ${base.height}`;
        slot.prepend(canvas);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      };
      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { io.unobserve(e.target); draw(e.target); } });
        }, { root: frame, rootMargin: "600px 0px" });
        slots.forEach((s) => io.observe(s));
      } else slots.forEach(draw);
    } catch (err) {
      if (token !== renderToken) return;
      frame.innerHTML = `<div class="reader-note">The paper couldn't be displayed here. Use “Open PDF in a new tab” above to read it.</div>`;
    }
  }

  /* ---------- Routing ---------- */
  const SECTIONS = ["research", "projects", "writing", "more"];
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const paper = S.papers.find((p) => p.id === h);
    const project = (S.projects || []).find((p) => p.id === h);
    if (paper) { renderPaper(paper); document.title = paper.shortTitle + " · " + S.profile.name; }
    else if (project) { renderProject(project); document.title = (project.shortTitle || project.title) + " · " + S.profile.name; }
    else { renderHome(SECTIONS.includes(h) ? h : null); document.title = S.profile.name + " Research"; }
  }
  function openPaper(id) { location.hash = id; }
  function go(section) {
    if (location.hash.slice(1) === section) route();
    else location.hash = section;
  }
  window.addEventListener("hashchange", route);
  renderRail();
  route();
})();
</script>
